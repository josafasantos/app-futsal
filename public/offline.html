<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Na Quadra — Offline</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.875rem; max-width: 300px; margin-bottom: 1.5rem; }
    button {
      background-color: #059669;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">⚽</div>
  <h1>Você está offline</h1>
  <p>Conecte-se à internet para sincronizar as partidas e dados da quadra.</p>
  <button onclick="window.location.reload()">Tentar novamente</button>
</body>
</html>
